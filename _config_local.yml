# Local-preview overrides. Layer this on top of _config.yml:
#
#   bundle exec jekyll serve --config _config.yml,_config_local.yml
#
# GitHub Pages uses _config.yml alone (remote_theme + jekyll-remote-theme).
# Locally we use the just-the-docs *gem* theme instead, so we don't need the
# jekyll-remote-theme plugin (and its native openssl build).

remote_theme:
theme: just-the-docs

# Drop jekyll-remote-theme from the plugin list for local builds.
plugins:
  - jekyll-seo-tag

# Serve at the site root locally so links resolve without the Pages baseurl.
baseurl: ""
url: "http://localhost:4000"
